<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPDP AI Sahayak — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: {
            darkbg: '#0B1220', cardbg: '#172033',
            brandgreen: '#22C55E', brandblue: '#3B82F6', brandred: '#EF4444'
        }}}}
    </script>
</head>
<body class="bg-darkbg text-slate-100 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="bg-cardbg border border-slate-800 rounded-2xl p-8 w-full max-w-sm">
        <div class="flex items-center justify-center space-x-2 mb-2">
            <div class="h-3 w-3 rounded-full bg-brandgreen animate-pulse"></div>
            <span class="font-bold text-lg text-white">DPDP Sahayak</span>
        </div>
        <p class="text-center text-sm text-slate-400 mb-6">Sign in to your compliance dashboard</p>

        <div id="formArea">
            <input type="email" id="email" placeholder="Email" class="w-full bg-darkbg border border-slate-700 rounded-lg px-4 py-2.5 text-sm mb-3 focus:outline-none focus:border-brandblue">
            <input type="password" id="password" placeholder="Password" class="w-full bg-darkbg border border-slate-700 rounded-lg px-4 py-2.5 text-sm mb-4 focus:outline-none focus:border-brandblue">
            <button onclick="login()" id="loginBtn" class="w-full bg-brandblue hover:bg-blue-600 text-white py-2.5 rounded-lg text-sm font-medium transition">Sign in</button>
            <p id="errorMsg" class="text-brandred text-xs text-center mt-3 hidden"></p>
            <p class="text-center text-xs text-slate-500 mt-5">
                No account? <a href="#" onclick="toggleSignup()" class="text-brandblue hover:underline">Create one</a>
            </p>
        </div>
    </div>

<script>
    let isSignup = false;

    function toggleSignup() {
        isSignup = !isSignup;
        document.getElementById('loginBtn').textContent = isSignup ? 'Create account' : 'Sign in';
        document.querySelector('#formArea p:last-child').innerHTML = isSignup
            ? `Already have an account? <a href="#" onclick="toggleSignup()" class="text-brandblue hover:underline">Sign in</a>`
            : `No account? <a href="#" onclick="toggleSignup()" class="text-brandblue hover:underline">Create one</a>`;
    }

    async function login() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        const btn = document.getElementById('loginBtn');
        errorMsg.classList.add('hidden');
        btn.disabled = true;

        const endpoint = isSignup ? '/signup' : '/login';

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (res.ok && data.status === 'success') {
                if (isSignup) {
                    errorMsg.textContent = 'Account created — please sign in.';
                    errorMsg.classList.remove('hidden');
                    errorMsg.classList.replace('text-brandred', 'text-brandgreen');
                    toggleSignup();
                } else {
                    sessionStorage.setItem('dpdp_token', data.access_token);
                    window.location.href = '/profile';
                }
            } else {
                errorMsg.textContent = data.message || 'Something went wrong.';
                errorMsg.classList.remove('hidden');
            }
        } catch (err) {
            errorMsg.textContent = 'Could not reach the server.';
            errorMsg.classList.remove('hidden');
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
